<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comment Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #064e3b;
            color: #6ee7b7;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 Comment Bot</h1>

    <div class="subtitle">
        Dashboard quản lý hệ thống
    </div>

    <div class="card">
        <h2>System Status</h2>

        <span class="status">
            ● Online
        </span>
    </div>

    <div class="card">
        <h2>Campaigns</h2>

        <p>Active campaigns: <strong>0</strong></p>
        <p>Opportunities found: <strong>0</strong></p>
        <p>Comments processed: <strong>0</strong></p>
    </div>

    <div class="card">
        <h2>Test</h2>

        <button onclick="testBot()">
            Test System
        </button>

        <p id="result"></p>
    </div>

</div>

<script>

function testBot() {

    document.getElementById("result").innerText =
        "✅ Hệ thống hoạt động bình thường!";

}

</script>

</body>
</html>
